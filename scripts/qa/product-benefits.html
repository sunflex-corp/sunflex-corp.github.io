<!doctype html><meta charset="utf-8"><title>SUNPLEX 제품별 강점 검수</title><style>body{margin:0;background:#344256;color:white;font:16px system-ui}header{display:flex;gap:12px;align-items:center;padding:12px}button,select{font:16px system-ui;padding:10px}main{display:flex;gap:20px;justify-content:center}iframe{border:0;background:white}label{display:block;padding:6px}#report{font-size:13px;max-width:600px}</style><header><select id="route"></select><button id="next">다음 제품</button><button id="one">01</button><button id="two">02</button><button id="three">03</button><span id="report">준비</span></header><main><div><label>모바일 390px</label><iframe id="mobile" width="390" height="1050"></iframe></div><div><label>데스크톱 1100px</label><iframe id="desktop" width="1100" height="1050"></iframe></div></main><script>
const q=new URLSearchParams(location.search);if(q.has('w')){mobile.width=q.get('w');mobile.height=q.get('h')||844;desktop.width=q.get('dw')||768;desktop.height=q.get('dh')||900;}
let data,slugs,index=+(new URLSearchParams(location.search).get("i")||0),loaded=0,results={};const frames=[mobile,desktop],tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
function showStage(i){for(const f of frames){const d=f.contentDocument,t=d.querySelector('#product-benefits [data-scroll-flow]');const b=t?.querySelectorAll('[role=tab]')[i];if(b)b.click();}}
function load(){loaded=0;report.textContent='검수 중';route.value=index;frames.forEach(f=>f.src='/products/'+slugs[index]+'/#product-benefits');}
async function audit(){const errors=[];for(const f of frames){const w=f.contentWindow,d=f.contentDocument,t=d.querySelector('#product-benefits [data-scroll-flow]');if(!t){errors.push('story missing');continue}await Promise.all([...t.querySelectorAll('img')].map(img=>{img.loading='eager';return img.decode().catch(()=>{})}));await tick();for(let i=0;i<3;i++){t.querySelectorAll('[role=tab]')[i].click();await tick();const panels=[...t.querySelectorAll('[data-flow-panel]')],p=panels[i],r=p.getBoundingClientRect();if(p.hidden||panels.filter(p=>!p.hidden).length!==1)errors.push(f.width+' state '+i);if(t.classList.contains('flow-pinned')&&(r.top<60||r.bottom>w.innerHeight))errors.push(f.width+' clipping '+i);if(p.scrollWidth>p.clientWidth+2)errors.push(f.width+' panel overflow '+i);if([...p.querySelectorAll('img')].some(x=>!x.naturalWidth))errors.push('broken image');const link=p.querySelector('a');if(!d.querySelector(link.getAttribute('href')))errors.push('broken reference');const desc=p.querySelector('.benefit-description');if(getComputedStyle(desc).color!=='rgb(195, 200, 209)')errors.push('body contrast style '+getComputedStyle(desc).color);}}
results[slugs[index]]=errors;localStorage.setItem('benefit-qa',JSON.stringify(results));showStage(index%3);report.textContent=(index+1)+' / '+slugs.length+' '+slugs[index]+' · '+(errors.length?errors.join(', '):'PASS: 6 states, images, links, layout');}
frames.forEach(f=>f.onload=async()=>{if(++loaded===2)await audit()});next.onclick=()=>{if(index<slugs.length-1){index++;load()}};route.onchange=()=>{index=+route.value;load()};one.onclick=()=>showStage(0);two.onclick=()=>showStage(1);three.onclick=()=>showStage(2);fetch('/data/product-benefits.json').then(r=>r.json()).then(d=>{data=d;slugs=Object.keys(d);route.innerHTML=slugs.map((s,i)=>`<option value="${i}">${i+1}. ${s}</option>`).join('');load()});
</script>
